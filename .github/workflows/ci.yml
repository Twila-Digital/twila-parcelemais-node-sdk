name: CI

on:
  pull_request:
    branches: [production]
  push:
    branches: [production]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        node: ['14', '18', '22']
        os: [ubuntu-latest]
        include:
          - node: '22'
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Troca para o Node da matriz
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - run: npm test

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm run test:coverage
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        with:
          directory: ./coverage
          fail_ci_if_error: false
